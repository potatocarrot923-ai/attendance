services:
  - type: web
    name: carrot-attendance
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "python -m py_compile server.py"
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: CARROT_PUBLIC_MODE
        value: "1"
      - key: CARROT_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CARROT_DATA_DIR
        value: /var/data
    disk:
      name: carrot-attendance-data
      mountPath: /var/data
      sizeGB: 1
